<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://chargetruth.example.com/"},{"@type":"ListItem","position":2,"name":"Swap finder","item":"https://chargetruth.example.com/swap.html"}]}</script>

<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="subpage-hero"><a href="./index.html">← Back to app</a></div>
<main id="main"><div class="grid2">
<div class="card"><h2><span class="material-symbols-rounded" aria-hidden="true">autorenew</span>Swap finder <span class="pill">Gogoro · Sun · CATL · NIO+Geely · Ola</span></h2>
<label>2W/3W vehicle <select id="swapVSelect"></select></label>
<label>Trip km <input id="swapKm" type="number" value="60"></label>
<label>Hour (rush) <input id="swapHour" type="number" value="12" min="0" max="23"></label>
<button id="swapBtn" class="big">🔄 Find swap cabins</button>
<div id="swapOut"></div>
</div>
<div class="card"><h2><span class="material-symbols-rounded" aria-hidden="true">swap_horiz</span>Swap vs Charge ROI</h2>
<div class="row3"><label>Rider Rs/hr <input id="roiHr" type="number" value="150"></label><label>Swaps/day <input id="roiN" type="number" value="3"></label><label>Charge hrs/day <input id="roiH" type="number" value="3"></label></div>
<button id="roiBtn">Calculate ROI</button><div id="roiOut"></div>
</div>
</div></main>
<footer><a href="./index.html">App</a> · <a href="./garage.html">Garage</a> · <a href="./research.html">Research</a> · Updated <time datetime="2026-10-10">Oct 10, 2026</time> · Next refresh Jan 2026</footer>
<script type="module">
import { loadAll, flattenStations } from './src/js/data-loader.js';
import { swapPlan, physicalFit, swapVsChargeROI } from './src/js/swap.js';
const $ = (id) => document.getElementById(id);
const DB = await loadAll();
const ST = flattenStations(DB.stations);
$('swapVSelect').innerHTML = DB.vehicles.vehicles.filter((v) => v.class !== '4W').map((v) => `<option value="${v.id}">${v.name} · ${v.swap || v.plugAc || ''}</option>`).join('');
$('swapVSelect').value = 'sun-buddy-2';
const vehById = (id) => DB.vehicles.vehicles.find((v) => v.id === id);
$('swapBtn').onclick = () => {
  const v = vehById($('swapVSelect').value);
  const km = +$('swapKm').value, hour = +$('swapHour').value || 12;
  const cabins = ST.filter((s) => s.swap);
  const sp = swapPlan({ vehicle: v, stations: cabins, distanceKm: km, hour, networks: DB.swaps.networks });
  let html = `<h3>${sp.network || 'Swap'} — ${km} km</h3>`;
  if (sp.error) html += `<div class="redcard">${sp.error}: ${v.name} is plug-in, use Plan Trip.</div>`;
  else {
    html += `<p><b>${sp.message}</b></p>` + sp.stops.map((s) => `<div class="st"><b>#${s.n} ${s.name}</b> — battery avail ${s.availPct}% · ${s.mins} min · ₹${s.priceINR}${s.warn ? `<div class="redcard">${s.warn}</div>` : ''}</div>`).join('');
    const bad = cabins.filter((s) => physicalFit(v.swap, s.swap).fit === false).slice(0, 2);
    if (bad.length && v.swap) html += `<p class="muted">Not routed (physical mismatch): ${bad.map((s) => `${s.name} [${s.swap}]`).join('; ')} — app merge ≠ physical interop.</p>`;
  }
  $('swapOut').innerHTML = html;
};
$('roiBtn').onclick = () => {
  const r = swapVsChargeROI({ riderHourly: +$('roiHr').value, swapsPerDay: +$('roiN').value, chargeHoursPerDay: +$('roiH').value });
  $('roiOut').innerHTML = `<table><tr><th></th><th>Swap</th><th>Charge</th></tr><tr><td>Monthly energy ₹</td><td>${r.swapMonth}</td><td>${r.chargeMonth}</td></tr><tr><td>Time saved</td><td colspan="2">${r.timeSavedHrsDay} hrs/day → ₹${r.timeValueMonth}/month</td></tr></table><p><b>${r.verdict}</b></p><p class="muted">Fleet ×500: ${r.fleet500.hrsSavedDay} hrs/day. ${r.fleet500.note}</p>`;
};
</script>
</body>
</html>
