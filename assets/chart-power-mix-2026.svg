<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" role="img" aria-label="55 to 72 percent of new ports are 250kW plus. High power is standard, execution is differentiator.">
<rect width="1200" height="630" fill="#0b1220"/>
<text x="60" y="80" fill="#e8f1ff" font-size="42" font-family="system-ui" font-weight="800">High Power Is Standard Now (Paren Q1-Q2 2026)</text>
<text x="60" y="120" fill="#a9bcd9" font-size="24" font-family="system-ui">Q1: 55-67% of new ports 250kW+ · Q2: 72% · sub-150kW down to 21%</text>
<g font-family="system-ui" font-size="26">
<text x="60" y="220" fill="#e8f1ff">250kW+ Q2 72%</text><rect x="340" y="192" width="720" height="34" fill="#00e676"/>
<text x="60" y="280" fill="#e8f1ff">250kW+ Q1 ~61%</text><rect x="340" y="252" width="610" height="34" fill="#8bff9e"/>
<text x="60" y="340" fill="#e8f1ff">sub-150kW 21%</text><rect x="340" y="312" width="210" height="34" fill="#ffc400"/>
<text x="60" y="400" fill="#e8f1ff">Util Q1 15.6% / Q2 15.76%</text><rect x="340" y="372" width="158" height="34" fill="#5c6b8a"/>
</g>
<text x="60" y="520" fill="#a9bcd9" font-size="22" font-family="system-ui">Source: Paren Q1 2026 (3,387 new ports, 73,394 total) + Q2 2026 (4,382 new ports).</text>
<text x="60" y="560" fill="#a9bcd9" font-size="22" font-family="system-ui">Takeaway: power-match filter hides 350kW hype. Uptime + load mgmt win.</text>
</svg>
